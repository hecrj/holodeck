name: Lint
on: [push, pull_request]
jobs:
  all:
    runs-on: macOS-latest
    steps:
    - name: Install OpenCV and Tesseract
      run: brew install opencv tesseract
    - uses: hecrj/setup-rust-action@v2
      with:
        components: clippy
    - uses: actions/checkout@master
    - name: Check lints
      run: cargo lint
